services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: loyaltybenefit-api:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: loyaltybenefit-worker:local
    restart: unless-stopped
    env_file: .env
